<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧸 5구역 말랑말랑 체크리스트</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary-cute: #ffb3ba;       /* 딸기우유 핑크 */
            --secondary-cute: #ffdfba;     /* 말랑 오렌지 */
            --yellow-cute: #ffffba;        /* 레몬 푸딩 */
            --green-cute: #baffc9;         /* 메론 크림 */
            --sky-cute: #bae1ff;           /* 소다 하늘 */
            --purple-cute: #e8aeff;        /* 블루베리 믹스 */
            --text-color: #65534c;         /* 진한 초코 브라운 */
            --bg-cute: #fffaf5;            /* 포근한 바닐라 크림 */
            --border-cute: #f9ebe0;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #fff5eb; border-radius: 20px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-cute); border: 2px solid #fff5eb; border-radius: 20px; }

        body {
            font-family: 'Malgun Gothic', 'Comic Sans MS', sans-serif;
            background-color: var(--bg-cute);
            background-image: linear-gradient(var(--border-cute) 1px, transparent 1px), linear-gradient(90deg, var(--border-cute) 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 12px;
            color: var(--text-color);
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 32px;
            box-shadow: 0 12px 32px rgba(255, 179, 186, 0.35);
            border: 4px dashed var(--primary-cute);
            box-sizing: border-box;
            position: relative;
        }

        .title-container { margin-bottom: 25px; text-align: center; }
        
        select, input[type="text"] {
            padding: 8px 10px; border: 2px solid #ebd9cc; border-radius: 16px; box-sizing: border-box;
            outline: none; font-size: 12px; font-weight: bold; color: var(--text-color); background-color: #fffdfb;
            height: 38px; box-shadow: inset 0 2px 4px rgba(93, 80, 74, 0.05); transition: all 0.2s;
        }
        select:focus, input:focus { border-color: var(--primary-cute); background-color: #ffffff; }

        /* 🛠️ 기한 칸: 브라우저 고정 '오전/오후' 문구를 지우기 위한 커스텀 24시 슬림 박스 테두리 */
        .time-24h-input-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fffdfb;
            border: 2px solid #ebd9cc;
            border-radius: 14px;
            padding: 4px 8px;
            width: 76px;
            height: 36px;
            box-sizing: border-radius;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
        }
        .time-24h-hidden {
            position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
        }

        .cute-card {
            background: #fffefb; border: 2px solid #f6ece2; padding: 16px; border-radius: 24px;
            margin-bottom: 18px; box-shadow: 0 6px 14px rgba(93, 80, 74, 0.04); box-sizing: border-box;
        }
        .cute-card h3 {
            margin-top: 0; font-size: 15px; color: #8c766c; border-left: 6px solid var(--primary-cute);
            padding-left: 10px; margin-bottom: 12px; display: flex; align-items: center; gap: 4px;
        }

        .nav-section { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .days-container, .tabs-container, .profiles-tabs-container {
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch;
        }
        .btn-nav {
            padding: 9px 16px; border: 2px solid #ebd9cc; background: white; border-radius: 20px;
            cursor: pointer; font-weight: bold; color: var(--text-color); white-space: nowrap; font-size: 12px;
            flex-shrink: 0; box-shadow: 0 3px 0 #ebd9cc; transition: all 0.1s;
        }
        .btn-nav:active { transform: translateY(2px); box-shadow: 0 1px 0 #ebd9cc; }
        .btn-nav.active { background: var(--primary-cute); color: white; border-color: var(--primary-cute); box-shadow: 0 3px 0 #e89ba3; }

        .btn-action {
            padding: 8px 14px; border: none; border-radius: 16px; cursor: pointer; font-size: 12px;
            font-weight: bold; color: white; height: 38px; display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s; box-shadow: 0 3px 0 rgba(0,0,0,0.15);
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
        .btn-sms { background-color: #b4d2ff; color: #1e3a8a; width: 100%; height: 36px; }
        .btn-add { 
            background-color: #ffb3ba; color: #7f1d1d; font-size: 14px; padding: 14px; width: 100%;
            margin-bottom: 18px; border-radius: 22px; box-shadow: 0 5px 0 #e89ba3;
        }
        .btn-danger { background-color: #ff9aa2; color: white; box-shadow: 0 3px 0 #e58284; height: 34px; }
        .btn-save-jelly { background-color: #baffc9; color: #1e4620; box-shadow: 0 3px 0 #9adba9; margin-left: 4px; }

        .table-responsive { 
            overflow-x: auto; border-radius: 20px; border: 3px solid #f6ece2; background: white;
            box-shadow: 0 6px 18px rgba(0,0,0,0.02); -webkit-overflow-scrolling: touch;
        }
        
        /* 🛠️ 간격 축소 및 높낮이 일렬 정렬 CSS 패키징 */
        table { width: 100%; border-collapse: separate; border-spacing: 0 4px; min-width: 920px; }
        th { background-color: #fff3f5; font-weight: bold; padding: 10px 4px; border-bottom: 3px solid var(--primary-cute); color: #b35660; font-size: 12px; white-space: nowrap; }
        td { padding: 6px 4px; background-color: #ffffff; border-top: 1px solid #fffdfb; border-bottom: 1px solid #fffdfb; font-size: 12px; vertical-align: middle; }
        tr td:first-child { border-left: 1px solid #fffdfb; border-radius: 18px 0 0 18px; }
        tr td:last-child { border-right: 1px solid #fffdfb; border-radius: 0 18px 18px 0; }

        .completed-row td { opacity: 0.4; text-decoration: line-through; }

        .checkbox-scroll-box {
            max-height: 95px; overflow-y: auto; border: 2px solid #ebd9cc; padding: 6px; border-radius: 14px; background: #fffdfb; box-sizing: border-box;
        }
        .item-checkbox-label { display: flex; align-items: center; gap: 4px; font-size: 11px; margin-bottom: 4px; cursor: pointer; white-space: nowrap; }
        input[type="checkbox"] { accent-color: #ff9aa2; transform: scale(1.1); cursor: pointer; }

        .color-palette {
            display: none; position: absolute; background: white; border: 2px solid var(--primary-cute); padding: 8px;
            grid-template-columns: repeat(5, 1fr); gap: 6px; z-index: 100; border-radius: 16px; box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .color-picker-btn { width: 100%; height: 34px; border: 2px solid #ebd9cc; border-radius: 14px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .days-grid-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; width: 120px; box-sizing: border-box; }
        .day-checkbox-label { display: inline-flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; background: #fffdfa; padding: 3px 1px; border-radius: 6px; border: 1px solid #ebd9cc; font-weight: bold; }

        .draggable-tag {
            background: #fff5f5; border: 2px solid #ffccd5; padding: 6px 12px; border-radius: 16px; font-size: 11px; font-weight: bold;
            display: inline-flex; align-items: center; gap: 6px; cursor: grab; user-select: none; transition: all 0.2s; box-shadow: 0 3px 0 #ffccd5;
        }
        .draggable-tag:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #ffccd5; background-color: #fffdfd; }
        .draggable-tag:active { cursor: grabbing; transform: translateY(1px); box-shadow: 0 1px 0 #ffccd5; }
        .draggable-tag.dragging { opacity: 0.4; background-color: #ffd1d1; }

        .timer-text { font-size: 11px; font-weight: bold; color: #ff4d6d; display: block; margin-top: 2px; text-align: center; }

        .cute-toast {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(101, 83, 76, 0.9);
            color: white; padding: 12px 22px; border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 99999;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); border: 2px solid var(--primary-cute); display: none; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="cute-toast" id="cute-toast-alarm">수신인 번호 복사 완료! 📋</div>

<div class="container">
    <div class="title-container">
        <div style="display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap;">
            <input type="text" id="checklist-title-input" style="font-size: 18px; font-weight: bold; width: 320px; text-align: center; border-radius: 20px;" placeholder="체크리스트 제목 입력">
            <button class="btn-action btn-save-jelly" onclick="saveTitleDirect()">💾 제목설정</button>
        </div>
    </div>

    <div class="cute-card">
        <h3>🏆 중요도 순위 색상 칩</h3>
        <div class="rank-list" id="rank-settings-container" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    </div>

    <div class="cute-card">
        <h3>✉️ 자동 고정 재촉 문자 양식 세팅</h3>
        <div style="display: flex; width: 100%;">
            <input type="text" id="sms-template-input" style="flex: 1;" placeholder="양식을 지정해주세요.">
            <button class="btn-action btn-save-jelly" onclick="saveSmsTemplateDirect()">💾 양식저장</button>
        </div>
    </div>

    <div class="nav-section">
        <div class="days-container" id="days-filter">
            <button class="btn-nav" id="filter-day-전체" onclick="filterDay('전체', this)">🗓️ 전체보기</button>
            <button class="btn-nav" id="filter-day-월" onclick="filterDay('월', this)">월요일</button>
            <button class="btn-nav" id="filter-day-화" onclick="filterDay('화', this)">화요일</button>
            <button class="btn-nav" id="filter-day-수" onclick="filterDay('수', this)">수요일</button>
            <button class="btn-nav" id="filter-day-목" onclick="filterDay('목', this)">목요일</button>
            <button class="btn-nav" id="filter-day-금" onclick="filterDay('금', this)">금요일</button>
            <button class="btn-nav" id="filter-day-토" onclick="filterDay('토', this)">토요일</button>
            <button class="btn-nav" id="filter-day-일" onclick="filterDay('일', this)">일요일</button>
        </div>
    </div>

    <div class="nav-section">
        <div class="tabs-container" id="parts-filter">
            <button class="btn-nav active" onclick="filterPart('전체보기', this)">📂 모든파트</button>
            <button class="btn-nav" onclick="filterPart('전도', this)">전도</button>
            <button class="btn-nav" onclick="filterPart('섭외', this)">섭외</button>
            <button class="btn-nav" onclick="filterPart('심방', this)">심방</button>
            <button class="btn-nav" onclick="filterPart('기타', this)">기타</button>
        </div>
    </div>

    <div class="nav-section">
        <span style="font-size:11px; font-weight:bold; color:#7a6f5d; padding-left:4px;">👤 사명자 개별 소팅 필터:</span>
        <div class="profiles-tabs-container" id="profiles-filter-container"></div>
    </div>

    <div class="cute-card" style="background:#fff9f9;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex-wrap: wrap;">
            <div>
                <h3>👤 주소록 명단 등록 (꾹~ 끌어서 예쁘게 1개씩 이동)</h3>
                <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                    <input type="text" id="new-profile-name" placeholder="이름" style="width:70px; flex-grow:1;">
                    <input type="text" id="new-profile-phone" placeholder="번호(숫자만)" style="width:110px; flex-grow:2;">
                    <button class="btn-action" style="background:#baffc9; color:#22543d; font-weight:bold;" onclick="addProfileName()">✨ 추가</button>
                </div>
                <div class="name-manage-list" id="name-manage-list" style="display:flex; gap:6px; flex-wrap:wrap; min-height:50px; padding:6px; border:2px dashed #ffccd5; border-radius:16px; background:#fffbfb;" ondragover="allowDrop(event)" ondrop="dropProfile(event)"></div>
            </div>
            <div style="border-left: 2px dashed #f6ece2; padding-left: 15px;">
                <h3>🌟 사명자 all 파일 세팅 (그룹원 지정)</h3>
                <div class="checkbox-scroll-box" id="all-group-setup-box" style="max-height: 120px;"></div>
            </div>
        </div>
    </div>

    <button class="btn-action btn-add" onclick="addNewRow()">＋ 새로운 할 일 칸 만들기 🧸</button>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th width="5%">완료</th>
                    <th width="8%">파트</th>
                    <th width="19%">수신 이름 (중복/개별체크)</th>
                    <th width="9%">기한 (24h)</th>
                    <th width="17%">할 일 내용</th>
                    <th width="11%">📩 문자 전송</th>
                    <th width="8%">색상</th>
                    <th width="18%">의무요일</th>
                    <th width="5%">삭제</th>
                </tr>
            </thead>
            <tbody id="todo-body"></tbody>
        </table>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBToZjjmsrEtbiHLtlPV7VrDQeZPgPzJOY",
  authDomain: "wkd-24afc.firebaseapp.com",
  projectId: "wkd-24afc",
  storageBucket: "wkd-24afc.firebasestorage.app",
  messagingSenderId: "222315253273",
  appId: "1:222315253273:web:05ae0a4e56a525ede7a488",
  measurementId: "G-DVTEQGWZNY"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const rainbowColors = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#c5a3ff', '#e8aeff', '#1a202c', '#ffffff', '#e2e8f0'];

let state = {
    title: "5구역 할 수 있다. 하나 된다. 하나님 도와주신다. 회피하지마.",
    smsTemplate: "[5구역 알림] {이름}님, 안내해 드립니다. 기한 {기한}까지 예정된 [{할일}] 미완료 상태입니다. 빠른 확인 부탁드립니다!",
    rankColors: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff'], 
    profiles: [], 
    todos: [],
    allGroupIds: [], 
    currentDayFilter: '전체',
    currentPartFilter: '전체보기',
    currentNameFilter: '전체'
};

let draggedProfileId = null;
let activeTimers = {}; 

window.onload = function() {
    const todayWeek = getCurrentDayOfWeek();
    state.currentDayFilter = todayWeek;
    const activeDayBtn = document.getElementById(`filter-day-${todayWeek}`);
    if(activeDayBtn) activeDayBtn.classList.add('active');

    db.collection("config").doc("mainState").onSnapshot((doc) => {
        if (doc.exists()) {
            const data = doc.data();
            state.title = data.title || state.title;
            state.rankColors = data.rankColors || state.rankColors;
            state.smsTemplate = data.smsTemplate || state.smsTemplate;
            state.allGroupIds = data.allGroupIds || [];
        } else {
            uploadConfig(); 
        }
        document.getElementById('checklist-title-input').value = state.title;
        document.getElementById('sms-template-input').value = state.smsTemplate;
        renderRankSettings();
        renderAllGroupSetup();
        renderTodos();
    });

    db.collection("profiles").onSnapshot((snapshot) => {
        state.profiles = [];
        snapshot.forEach(doc => state.profiles.push({id: doc.id, ...doc.data()}));
        state.profiles.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
        
        renderProfiles();
        renderProfilesFilter();
        renderAllGroupSetup();
        renderTodos();
    });

    db.collection("todos").onSnapshot((snapshot) => {
        state.todos = [];
        snapshot.forEach(doc => state.todos.push({id: doc.id, ...doc.data()}));
        checkAndCleanOldTodos();
        renderTodos();
    });
};

function uploadConfig() {
    db.collection("config").doc("mainState").set({
        title: state.title,
        rankColors: state.rankColors,
        smsTemplate: state.smsTemplate,
        allGroupIds: state.allGroupIds
    });
}

function saveTitleDirect() {
    const val = document.getElementById('checklist-title-input').value.trim();
    state.title = val || "5구역 공동 체크리스트";
    uploadConfig();
    alert('체크리스트 제목이 영구 저장되었습니다! 🧸');
}

function saveSmsTemplateDirect() {
    const val = document.getElementById('sms-template-input').value.trim();
    state.smsTemplate = val;
    uploadConfig();
    alert('재촉 문자 기본 고정 양식이 영구 저장되었습니다! ✉️');
}

function renderRankSettings() {
    const container = document.getElementById('rank-settings-container');
    container.innerHTML = '';
    for(let i=0; i<5; i++) {
        container.innerHTML += `
            <div class="rank-item">
                <span>${i+1}위</span>
                <input type="color" value="${state.rankColors[i]}" onchange="updateRankColor(${i}, this.value)">
            </div>
        `;
    }
}

function updateRankColor(index, color) {
    state.rankColors[index] = color;
    uploadConfig();
}

function renderProfilesFilter() {
    const container = document.getElementById('profiles-filter-container');
    const activeClass = state.currentNameFilter === '전체' ? 'active' : '';
    let html = `<button class="btn-nav ${activeClass}" onclick="filterName('전체', this)">👤 전체보기</button>`;
    
    state.profiles.forEach(p => {
        const act = state.currentNameFilter === p.id ? 'active' : '';
        html += `<button class="btn-nav ${act}" onclick="filterName('${p.id}', this)">${p.name}</button>`;
    });
    container.innerHTML = html;
}

function filterName(profileId, btn) {
    state.currentNameFilter = profileId;
    document.querySelectorAll('#profiles-filter-container .btn-nav').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTodos();
}

function renderProfiles() {
    const listDiv = document.getElementById('name-manage-list');
    listDiv.innerHTML = '';
    state.profiles.forEach((p) => {
        listDiv.innerHTML += `
            <div class="draggable-tag" draggable="true" data-id="${p.id}" ondragstart="dragProfileStart(event)" ondragend="dragProfileEnd(event)" ondragover="allowDrop(event)">
                <strong>${p.name}</strong>
                <button style="border:none; background:none; color:#ff6b6b; font-weight:bold; cursor:pointer;" onclick="deleteProfile('${p.id}')">×</button>
            </div>
        `;
    });
}

function dragProfileStart(e) {
    draggedProfileId = e.target.getAttribute('data-id');
    e.target.classList.add('dragging');
}
function dragProfileEnd(e) { e.target.classList.remove('dragging'); }
function allowDrop(e) { e.preventDefault(); }

async function dropProfile(e) {
    e.preventDefault();
    const targetTag = e.target.closest('.draggable-tag');
    if (!targetTag) return;
    const targetId = targetTag.getAttribute('data-id');
    if (draggedProfileId === targetId) return;

    let targetIdx = state.profiles.findIndex(p => p.id === targetId);
    let draggedIdx = state.profiles.findIndex(p => p.id === draggedProfileId);
    
    const movedItem = state.profiles.splice(draggedIdx, 1)[0];
    state.profiles.splice(targetIdx, 0, movedItem);

    const batch = db.batch();
    state.profiles.forEach((p, i) => {
        const ref = db.collection("profiles").doc(p.id);
        batch.update(ref, { sortOrder: i });
    });
    await batch.commit();
}

function renderAllGroupSetup() {
    const box = document.getElementById('all-group-setup-box');
    box.innerHTML = state.profiles.map(p => {
        const isChecked = state.allGroupIds.includes(p.id) ? 'checked' : '';
        return `
            <label class="item-checkbox-label">
                <input type="checkbox" ${isChecked} onchange="toggleAllGroupMember('${p.id}', this.checked)"> ${p.name}
            </label>
        `;
    }).join('');
}

function toggleAllGroupMember(profileId, checked) {
    if (checked) {
        if (!state.allGroupIds.includes(profileId)) state.allGroupIds.push(profileId);
    } else {
        state.allGroupIds = state.allGroupIds.filter(id => id !== profileId);
    }
    uploadConfig();
}

async function addProfileName() {
    const nameInp = document.getElementById('new-profile-name');
    const phoneInp = document.getElementById('new-profile-phone');
    if(!nameInp.value.trim()) return alert('이름을 써주세요!');
    let purePhone = phoneInp.value.replace(/[^0-9]/g, "") || "01000000000";

    const newName = nameInp.value.trim();
    nameInp.value = ''; phoneInp.value = '';

    await db.collection("profiles").add({ name: newName, phone: purePhone, sortOrder: state.profiles.length });
}

async function deleteProfile(id) {
    await db.collection("profiles").doc(id).delete();
    state.allGroupIds = state.allGroupIds.filter(gid => id !== gid);
    uploadConfig();
}

async function addNewRow() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    
    await db.collection("todos").add({
        done: false,
        part: '전도',
        profileIds: [],       
        checkedProfileIds: [], 
        dueDateTime: now.toISOString().slice(0, 16),
        task: '',
        bgColor: '#ffffff',
        fixedDays: [],
        createdDay: getCurrentDayOfWeek(),
        timestamp: Date.now()
    });
}

async function deleteTodo(id) {
    if(activeTimers[id]) { clearInterval(activeTimers[id].interval); delete activeTimers[id]; }
    await db.collection("todos").doc(id).delete();
}
async function updateTodoField(id, field, value) { await db.collection("todos").doc(id).update({ [field]: value }); }

async function toggleTodoProfileSelection(todoId, profileId, checked) {
    const ref = db.collection("todos").doc(todoId);
    const todo = state.todos.find(t => t.id === todoId);
    if(!todo) return;

    if (profileId === 'ALL_GROUP') {
        if (checked) {
            await ref.update({ profileIds: firebase.firestore.FieldValue.arrayUnion(...state.allGroupIds) });
        } else {
            let currentProfiles = todo.profileIds || [];
            let filteredProfiles = currentProfiles.filter(pid => !state.allGroupIds.includes(pid));
            let currentChecked = todo.checkedProfileIds || [];
            let filteredChecked = currentChecked.filter(pid => !state.allGroupIds.includes(pid));
            await ref.update({ profileIds: filteredProfiles, checkedProfileIds: filteredChecked });
            handleRowCheckboxLogic(todoId);
        }
    } else {
        if(checked) {
            await ref.update({ profileIds: firebase.firestore.FieldValue.arrayUnion(profileId) });
        } else {
            await ref.update({ 
                profileIds: firebase.firestore.FieldValue.arrayRemove(profileId),
                checkedProfileIds: firebase.firestore.FieldValue.arrayRemove(profileId)
            });
            handleRowCheckboxLogic(todoId);
        }
    }
}

async function handleTodoProfileDoneCheckbox(todoId, profileId, checked) {
    const ref = db.collection("todos").doc(todoId);
    if(checked) {
        await ref.update({ checkedProfileIds: firebase.firestore.FieldValue.arrayUnion(profileId) });
    } else {
        await ref.update({ checkedProfileIds: firebase.firestore.FieldValue.arrayRemove(profileId) });
    }
    handleRowCheckboxLogic(todoId);
}

// 🛠️ 1번 요구사항: 개별체크박스가 다 켜지면 메인 완료 칸도 동시 자동 체크 활성화
async function handleRowCheckboxLogic(todoId) {
    setTimeout(async () => {
        const freshDoc = await db.collection("todos").doc(todoId).get();
        const data = freshDoc.data();
        if(!data) return;

        const pIds = data.profileIds || [];
        const cIds = data.checkedProfileIds || [];

        if(pIds.length > 0 && pIds.every(id => cIds.includes(id))) {
            if(!data.done && !activeTimers[todoId]) {
                startRowCountdown(todoId);
            }
        } else {
            if(activeTimers[todoId]) {
                clearInterval(activeTimers[todoId].interval);
                delete activeTimers[todoId];
                const timerSpan = document.getElementById(`countdown-${todoId}`);
                if(timerSpan) timerSpan.innerText = "";
            }
            if(data.done) {
                await db.collection("todos").doc(todoId).update({ done: false, doneTimestamp: firebase.firestore.FieldValue.delete() });
            }
        }
    }, 250);
}

function startRowCountdown(todoId) {
    let timeLeft = 5;
    const timerSpan = document.getElementById(`countdown-${todoId}`);
    if(timerSpan) timerSpan.innerText = `⏳ ${timeLeft}s`;

    const interval = setInterval(async () => {
        timeLeft--;
        const curSpan = document.getElementById(`countdown-${todoId}`);
        if(curSpan) curSpan.innerText = `⏳ ${timeLeft}s`;

        if(timeLeft <= 0) {
            clearInterval(interval);
            delete activeTimers[todoId];
            if(curSpan) curSpan.innerText = "";
            await db.collection("todos").doc(todoId).update({ done: true, doneTimestamp: Date.now() });
        }
    }, 1000);

    activeTimers[todoId] = { interval: interval };
}

function handleMainDoneManual(todoId, checked) {
    if(checked) {
        startRowCountdown(todoId);
    } else {
        if(activeTimers[todoId]) {
            clearInterval(activeTimers[todoId].interval);
            delete activeTimers[todoId];
        }
        db.collection("todos").doc(todoId).update({ done: false, doneTimestamp: firebase.firestore.FieldValue.delete() });
        const timerSpan = document.getElementById(`countdown-${todoId}`);
        if(timerSpan) timerSpan.innerText = "";
    }
}

function checkAndCleanOldTodos() {
    const oneWeekMs = 7 * 24 * 60 * 60 * 1000;
    const now = Date.now();

    state.todos.forEach(async (t) => {
        if (t.done && t.doneTimestamp && (now - t.doneTimestamp > oneWeekMs)) {
            const hasFixedDays = t.fixedDays && t.fixedDays.length > 0;
            if (hasFixedDays) {
                await db.collection("todos").doc(t.id).update({
                    done: false,
                    checkedProfileIds: [], 
                    doneTimestamp: firebase.firestore.FieldValue.delete()
                });
            } else {
                await db.collection("todos").doc(t.id).delete();
            }
        }
    });
}

function selectRowColor(todoId, color) { updateTodoField(todoId, 'bgColor', color); }

function filterDay(day, btn) {
    state.currentDayFilter = day;
    document.querySelectorAll('#days-filter .btn-nav').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTodos();
}

function filterPart(part, btn) {
    state.currentPartFilter = part;
    document.querySelectorAll('#parts-filter .btn-nav').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTodos();
}

async function updateTodoFixedDays(id, day, checked) {
    const ref = db.collection("todos").doc(id);
    if(checked) {
        await ref.update({ fixedDays: firebase.firestore.FieldValue.arrayUnion(day) });
    } else {
        await ref.update({ fixedDays: firebase.firestore.FieldValue.arrayRemove(day) });
    }
}

function renderTodos() {
    const tbody = document.getElementById('todo-body');
    tbody.innerHTML = '';

    let filtered = state.todos.filter(t => {
        if(state.currentPartFilter !== '전체보기' && t.part !== state.currentPartFilter) return false;
        if(state.currentDayFilter !== '전체') {
            const hasFixedDays = t.fixedDays && t.fixedDays.length > 0;
            if(hasFixedDays) { if(!t.fixedDays.includes(state.currentDayFilter)) return false; }
        }
        if(state.currentNameFilter !== '전체') { if(!t.profileIds || !t.profileIds.includes(state.currentNameFilter)) return false; }
        return true;
    });

    filtered.sort((a, b) => {
        if (a.done === b.done) return (b.timestamp || 0) - (a.timestamp || 0);
        return a.done ? 1 : -1;
    });

    filtered.forEach(t => {
        const tProfileIds = t.profileIds || [];
        const tCheckedIds = t.checkedProfileIds || [];

        const isAllGroupChecked = state.allGroupIds.length > 0 && state.allGroupIds.every(id => tProfileIds.includes(id)) ? 'checked' : '';

        let profileCheckboxes = `
            <label class="item-checkbox-label" style="color: #ff8b94; font-weight: bold; border-bottom: 2px dashed #f6ece2; padding-bottom:4px; margin-bottom:6px;">
                <input type="checkbox" ${isAllGroupChecked} onchange="toggleTodoProfileSelection('${t.id}', 'ALL_GROUP', this.checked)"> 🌟 사명자 all
            </label>
        `;

        profileCheckboxes += state.profiles.map(p => {
            const isAssigned = tProfileIds.includes(p.id);
            const isAssignedChecked = isAssigned ? 'checked' : '';
            const isDoneChecked = tCheckedIds.includes(p.id) ? 'checked' : '';
            
            const doneBoxHtml = isAssigned ? 
                `<input type="checkbox" ${isDoneChecked} title="완료" onchange="handleTodoProfileDoneCheckbox('${t.id}', '${p.id}', this.checked)" style="margin-left:auto; accent-color: #4ade80;">` : '';

            return `
                <div style="display:flex; align-items:center; width:100%; gap:4px; margin-bottom:4px;">
                    <label class="item-checkbox-label" style="flex:1; margin-bottom:0;">
                        <input type="checkbox" ${isAssignedChecked} onchange="toggleTodoProfileSelection('${t.id}', '${p.id}', this.checked)"> ${p.name}
                    </label>
                    ${doneBoxHtml}
                </div>
            `;
        }).join('');

        let paletteCells = rainbowColors.map(c => `
            <div style="background:${c}; width:20px; height:20px; cursor:pointer; border:1px solid #555; border-radius:4px;" onclick="selectRowColor('${t.id}', '${c}')"></div>
        `).join('');

        const isRowDoneChecked = t.done ? 'checked' : '';
        const rowClass = t.done ? 'completed-row' : '';
        const fontColor = (t.bgColor === '#1a202c') ? '#fff' : '#65534c';

        const weekDays = ['월', '화', '수', '목', '금', '토', '일'];
        let dayCheckboxes = weekDays.map(d => {
            const isDayChecked = (t.fixedDays && t.fixedDays.includes(d)) ? 'checked' : '';
            return `
                <label class="day-checkbox-label">
                    <input type="checkbox" ${isDayChecked} onchange="updateTodoFixedDays('${t.id}', '${d}', this.checked)"> ${d}
                </label>
            `;
        }).join('');

        // 🛠️ 2번 요구사항: 오전/오후 글자를 완벽히 배제하고 강제로 24시간 표기법 고정 가공
        let timeOnlyValue = "12:00";
        if (t.dueDateTime && t.dueDateTime.includes('T')) {
            timeOnlyValue = t.dueDateTime.split('T')[1].slice(0, 5); 
        } else if (t.dueDateTime && t.dueDateTime.length === 5) {
            timeOnlyValue = t.dueDateTime;
        }

        // 🛠️ 3번 요구사항: 어긋남 없이 깔끔한 일렬 정렬 및 간격 초압축 매핑 완료
        tbody.innerHTML += `
            <tr class="${rowClass}" style="background-color: ${t.bgColor}; color: ${fontColor};">
                <td style="text-align:center; vertical-align: middle;">
                    <input type="checkbox" ${isRowDoneChecked} onchange="handleMainDoneManual('${t.id}', this.checked)" style="transform: scale(1.3); cursor:pointer;">
                    <span class="timer-text" id="countdown-${t.id}"></span>
                </td>
                <td>
                    <select onchange="updateTodoField('${t.id}', 'part', this.value)" style="width:66px;">
                        <option value="전도" ${t.part==='전도'?'selected':''}>전도</option>
                        <option value="섭외" ${t.part==='섭외'?'selected':''}>섭외</option>
                        <option value="심방" ${t.part==='심방'?'selected':''}>심방</option>
                        <option value="기타" ${t.part==='기타'?'selected':''}>기타</option>
                    </select>
                </td>
                <td><div class="checkbox-scroll-box" style="width:130px;">${profileCheckboxes}</div></td>
                <td style="text-align:center;">
                    <div class="time-24h-input-box" onclick="document.getElementById('raw-time-${t.id}').showPicker()">${timeOnlyValue}</div>
                    <input type="time" id="raw-time-${t.id}" class="time-24h-hidden" value="${timeOnlyValue}" onchange="saveTimeOnlyValue('${t.id}', this.value)">
                </td>
                <td><input type="text" value="${t.task || ''}" style="color:${fontColor}; background:transparent; width:125px;" placeholder="할 일 적기" onchange="updateTodoField('${t.id}', 'task', this.value)"></td>
                <td>
                    <button class="btn-action btn-sms" style="height:34px; font-size:11px; padding:0 6px;" onclick="handleSmsRoutingDirect('${t.id}')">🚀 즉시재촉</button>
                </td>
                <td>
                    <div style="position:relative; width:62px;">
                        <button class="color-picker-btn" style="background:${t.bgColor}; color:${fontColor};" onclick="toggleColorPalette('${t.id}')">🎨 색상</button>
                        <div class="color-palette" id="palette-${t.id}">${paletteCells}</div>
                    </div>
                </td>
                <td><div class="days-grid-box">${dayCheckboxes}</div></td>
                <td><button class="btn-action btn-danger" style="height:32px; padding:0 6px;" onclick="deleteTodo('${t.id}')">삭제</button></td>
            </tr>
        `;
    });
}

function saveTimeOnlyValue(todoId, timeStr) {
    if(!timeStr) return;
    const todayStr = new Date().toISOString().slice(0, 10); 
    updateTodoField(todoId, 'dueDateTime', todayStr + "T" + timeStr);
}

function renderBulkSmsProfileBox() {
    const box = document.getElementById('bulk-sms-profiles-box');
    box.innerHTML = state.profiles.map(p => `
        <label class="item-checkbox-label">
            <input type="checkbox" class="bulk-receiver-chk" value="${p.id}"> ${p.name}
        </label>
    `).join('');
}

function makeSmsMessageText(todo, targets) {
    let fmt = state.smsTemplate;
    let names = targets.map(p => p.name).join(', ');
    let timeStr = "";
    if(todo.dueDateTime && todo.dueDateTime.includes('T')) {
        timeStr = todo.dueDateTime.split('T')[1].slice(0,5);
    } else {
        timeStr = todo.dueDateTime || "";
    }
    return fmt.replace(/{이름}/g, names).replace(/{기한}/g, timeStr).replace(/{할일}/g, todo.task || "(내용없음)");
}

function handleSmsRoutingDirect(todoId) {
    const todo = state.todos.find(t => t.id === todoId);
    if(!todo || !todo.profileIds || todo.profileIds.length === 0) return alert('대상을 선택해 주세요!');

    const targetPeople = state.profiles.filter(p => todo.profileIds.includes(p.id));
    const resultMessage = makeSmsMessageText(todo, targetPeople);
    
    // 번호들이 한꺼번에 콤마(,) 형태로 복사되어 전달
    const phonesCombined = targetPeople.map(p => p.phone).join(',');

    copyToClipboard(phonesCombined, () => {
        showCuteToastNotification();
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        window.location.href = `sms:${phonesCombined}${isIOS ? '&' : '?'}body=${encodeURIComponent(resultMessage)}`;
    });
}

function fireBulkSmsDirect(type) {
    const checkedBoxes = document.querySelectorAll('.bulk-receiver-chk:checked');
    if(checkedBoxes.length === 0) return alert('대상을 선택해 주세요.');
    const textContent = document.getElementById('bulk-sms-content').value.trim();
    if(!textContent) return alert('문자 내용을 입력해 주세요.');

    const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);
    const targetPeople = state.profiles.filter(p => selectedIds.includes(p.id));
    const phonesCombined = targetPeople.map(p => p.phone).join(',');

    copyToClipboard(phonesCombined, () => {
        showCuteToastNotification();
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        window.location.href = `sms:${phonesCombined}${isIOS ? '&' : '?'}body=${encodeURIComponent(textContent)}`;
    });
}

function showCuteToastNotification() {
    const toast = document.getElementById('cute-toast-alarm');
    toast.style.display = 'block';
    toast.style.opacity = '1';
    
    setTimeout(() => {
        let opacity = 1;
        const fadeInterval = setInterval(() => {
            opacity -= 0.1;
            toast.style.opacity = opacity;
            if(opacity <= 0) {
                clearInterval(fadeInterval);
                toast.style.display = 'none';
            }
        }, 30);
    }, 1200); 
}

function copyToClipboard(text, callback) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(callback).catch(() => fallbackCopy(text, callback));
    } else {
        fallbackCopy(text, callback);
    }
}

function fallbackCopy(text, callback) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "absolute";
    textArea.style.left = "-999999px";
    textArea.style.top = document.documentElement.scrollTop + "px";
    document.body.appendChild(textArea);
    
    if (navigator.userAgent.match(/ipad|iphone/i)) {
        const range = document.createRange();
        range.selectNodeContents(textArea);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        textArea.setSelectionRange(0, 999999);
    } else {
        textArea.focus();
        textArea.select();
    }
    
    try {
        const successful = document.execCommand('copy');
        if (successful) callback();
        else alert('복사 실패 수동 복사 필요');
    } catch (err) {
        alert('복사 실패 수동 복사 필요');
    }
    document.body.removeChild(textArea);
}

function toggleColorPalette(id) {
    const palette = document.getElementById(`palette-${id}`);
    if(palette.style.display === 'grid') {
        palette.style.display = 'none';
    } else {
        document.querySelectorAll('.color-palette').forEach(p => p.style.display = 'none');
        palette.style.display = 'grid';
    }
}

function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
    document.getElementById('sms-modal').style.display = 'none';
}

function getCurrentDayOfWeek() {
    const week = ['일', '월', '화', '수', '목', '금', '토'];
    return week[new Date().getDay()];
}
